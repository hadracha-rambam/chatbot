name: CI

on:
  push:
  pull_request:

# ריצה אחת לכל ref - ריצה ישנה נעצרת כשנדחף קומיט חדש
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  student-in:
    name: student-in · typecheck & build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: student-in

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: student-in/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: Build
        run: npm run build
