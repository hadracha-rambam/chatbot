# פרסום גרסת תצוגה של STUDENT iN ל-GitHub Pages.
#
# דורש הפעלה חד-פעמית בהגדרות הריפו:
#   Settings -> Pages -> Build and deployment -> Source: GitHub Actions
# בלי זה שלב deploy-pages ייכשל.
#
# כתובת האתר לאחר הפרסום: https://hadracha-rambam.github.io/chatbot/
# זו גרסת טיוטה לבדיקה בלבד. הדף מסומן noindex, nofollow.

name: Deploy preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# פרסום אחד בכל רגע נתון. לא מבטלים פרסום שכבר רץ, כדי לא להשאיר
# את האתר במצב חלקי.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build preview
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: student-in

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: student-in/package-lock.json

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: student-in/dist

  deploy:
    name: Deploy preview
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
