<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/webp" href="/rambam-logo.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <!-- גרסת תצוגה בלבד - אין לאנדקס ואין לעקוב אחרי קישורים -->
    <meta name="robots" content="noindex, nofollow" />
    <meta
      name="description"
      content="STUDENT iN - כל מה שכדאי לדעת כסטודנט.ית ברמב״ם. הזכויות, השעות, החופשות וההטבות במקום אחד."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>STUDENT iN · כל מה שכדאי לדעת כסטודנט.ית ברמב״ם</title>
    <!--
      GitHub Pages מגיש קבצים סטטיים בלבד ולא יודע לנתב מסלולים של SPA.
      טעינה ישירה של /chatbot/rights/exam-day מחזירה 404.html, שמפנה חזרה
      לכאן עם הנתיב בתוך ה-query. כאן מחזירים את הנתיב המקורי לשורת הכתובת
      לפני שהאפליקציה עולה, כך שהראוטר רואה את המסלול הנכון.
      מבוסס על התבנית המקובלת spa-github-pages.
    -->
    <script>
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
