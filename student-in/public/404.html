<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>STUDENT iN</title>
    <!--
      נתיב שלא קיים כקובץ סטטי מגיע לכאן. מקודדים את הנתיב לתוך ה-query
      ומפנים לשורש האתר, ושם הסקריפט ב-index.html מחזיר אותו לשורת הכתובת.
      pathSegmentsToKeep = 1 כי האתר יושב תחת /chatbot/ ולא בשורש הדומיין.
    -->
    <script>
      (function (l) {
        var pathSegmentsToKeep = 1;
        l.replace(
          l.protocol +
            '//' +
            l.hostname +
            (l.port ? ':' + l.port : '') +
            l.pathname
              .split('/')
              .slice(0, 1 + pathSegmentsToKeep)
              .join('/') +
            '/?/' +
            l.pathname
              .slice(1)
              .split('/')
              .slice(pathSegmentsToKeep)
              .join('/')
              .replace(/&/g, '~and~') +
            (l.search ? '&' + l.search.slice(1) : '') +
            l.hash,
        );
      })(window.location);
    </script>
  </head>
  <body></body>
</html>
